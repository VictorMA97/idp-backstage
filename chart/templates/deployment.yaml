apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  labels:
    app.kubernetes.io/name: backstage
    {{- include "backstage.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        {{- include "backstage.labels" . | nindent 8 }}
    spec:
      serviceAccountName: backstage
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Backstage no reintenta si la base de datos aún no existe. Espera aquí a que PostgreSQL
        # responda; el Service de PostgreSQL es headless y su nombre DNS solo resuelve cuando el pod
        # está Ready, así que sin esta espera un arranque en frío falla con ENOTFOUND.
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h backstage-postgres -p 5432 -U backstage; do
                echo "esperando a PostgreSQL..."; sleep 2
              done
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: backstage
          image: {{ include "backstage.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: APP_BASE_URL
              value: {{ .Values.baseUrl | quote }}
            - name: POSTGRES_HOST
              value: backstage-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            {{- range $k := list "POSTGRES_PASSWORD" "BACKEND_SECRET" "AUTH_GITHUB_CLIENT_ID" "AUTH_GITHUB_CLIENT_SECRET" "GITHUB_TOKEN" }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ $k }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Debe usar readiness, no liveness: liveness responde 200 aunque el backend haya fallado al
          # arrancar. Con readiness, si en 3 minutos no está listo, Kubernetes reinicia el contenedor.
          startupProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /.backstage/health/v1/liveness, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Con el sistema de ficheros en solo lectura, Backstage escribe aquí (scaffolder, caché)
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
