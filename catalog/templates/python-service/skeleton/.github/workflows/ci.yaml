name: ci

# Todas las acciones están fijadas por SHA de commit (el tag va como comentario).
# Motivo: en marzo de 2026 se manipularon los tags de aquasecurity/trivy-action
# (ver README, sección Seguridad del pipeline). Un tag se puede mover; un SHA no.
# No se usa pull_request_target en ningún workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - "chart/values-dev.yaml"
      - "chart/values-prod.yaml"
      - "**.md"
  pull_request:
    branches: [main]

# Por defecto, sin permisos. Cada job pide solo lo que necesita.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Última versión del binario de Trivy verificada como limpia tras el incidente de marzo de 2026.
  # Súbela de forma deliberada, comprobando antes el aviso GHSA-69fq-xp46-6x23.
  TRIVY_VERSION: v0.69.3

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      # helm viene preinstalado en los runners de GitHub
      - name: Lint y render del chart
        run: |
          helm lint chart -f chart/values-dev.yaml
          helm lint chart -f chart/values-prod.yaml
          helm template ci-dev chart -f chart/values-dev.yaml > /dev/null
          helm template ci-prod chart -f chart/values-prod.yaml > /dev/null

  # En pull requests: construye sin publicar y escanea la imagen local
  scan-pr:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: service:pr
          provenance: false
          sbom: false
          cache-from: type=gha

      - name: Instalar Trivy (acción fijada por SHA)
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Escanear con Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          skip-setup-trivy: true
          image-ref: service:pr
          version: ${{ env.TRIVY_VERSION }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # En main, el flujo se divide en tres jobs con permisos distintos para aislar a Trivy
  # (tercero que sufrió un compromiso en 2026) de la identidad de firma y de los permisos de escritura:
  #   build (packages: write) -> scan (packages: read) -> sign (packages: write + id-token: write)

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write     # publicar en GHCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calcular nombre y tag de la imagen
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Solo lectura del registro: sin escritura, sin id-token, sin acceso al código con credenciales.
  # Si falla, sign y deploy-dev no se ejecutan.
  scan:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Trivy (acción fijada por SHA)
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Escanear la imagen publicada (por digest)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          # Trivy lee estas variables nativamente; el token es de solo lectura en este job
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          skip-setup-trivy: true
          image-ref: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          version: ${{ env.TRIVY_VERSION }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  sign:
    needs: [build, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write     # subir firma y attestation junto a la imagen
      id-token: write     # firma keyless con Cosign (OIDC de GitHub)
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Firmar la imagen (keyless)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Adjuntar el SBOM como attestation firmada
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

  # Despliega en dev: escribe tag y digest en values-dev.yaml; Argo CD hace el resto
  deploy-dev:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # commit del nuevo tag al repo (GitOps)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actualizar values-dev.yaml
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          yq -i '.image.repository = strenv(IMAGE) | .image.tag = strenv(TAG) | .image.digest = strenv(DIGEST)' chart/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/values-dev.yaml
          git diff --cached --quiet && { echo "Sin cambios que desplegar"; exit 0; }
          git commit -m "chore(dev): desplegar ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
