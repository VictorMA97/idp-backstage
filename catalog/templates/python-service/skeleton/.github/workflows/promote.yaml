name: promote-to-prod

# Promoción manual dev -> prod. Antes de tocar prod se VERIFICA que la imagen:
#   1) está firmada por el workflow ci.yaml de ESTE repo en la rama main
#   2) lleva el SBOM atestado con la misma identidad
# Configura reviewers obligatorios en Settings -> Environments -> production.

on:
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write     # commit a values-prod.yaml
      packages: read      # leer la firma desde GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Leer la versión desplegada en dev
        id: dev
        run: |
          image="$(yq '.image.repository' chart/values-dev.yaml)"
          tag="$(yq '.image.tag' chart/values-dev.yaml)"
          digest="$(yq '.image.digest' chart/values-dev.yaml)"
          for v in "$image" "$tag" "$digest"; do
            [[ -n "$v" && "$v" != "null" ]] || { echo "dev aún no tiene una versión desplegada"; exit 1; }
          done
          {
            echo "image=${image}"
            echo "tag=${tag}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verificar firma y attestation
        env:
          IMAGE: ${{ steps.dev.outputs.image }}
          DIGEST: ${{ steps.dev.outputs.digest }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yaml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" > /dev/null
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type spdxjson \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" > /dev/null
          echo "Firma y SBOM verificados para ${IMAGE}@${DIGEST}"

      - name: Actualizar values-prod.yaml
        env:
          IMAGE: ${{ steps.dev.outputs.image }}
          TAG: ${{ steps.dev.outputs.tag }}
          DIGEST: ${{ steps.dev.outputs.digest }}
        run: |
          yq -i '.image.repository = strenv(IMAGE) | .image.tag = strenv(TAG) | .image.digest = strenv(DIGEST)' chart/values-prod.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/values-prod.yaml
          git diff --cached --quiet && { echo "prod ya está en esta versión"; exit 0; }
          git commit -m "chore(prod): promover ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
