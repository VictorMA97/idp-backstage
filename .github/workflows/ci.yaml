name: ci

# Mismo pipeline que idp-sample-app: acciones fijadas por SHA de commit (el tag va de comentario),
# jobs aislados con permisos mínimos, escaneo con Trivy, firma Cosign keyless y despliegue por digest.
# No se usa pull_request_target.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "chart/values-mgmt.yaml"
      - "**.md"
  pull_request:
    branches: [main, master]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Última versión del binario de Trivy verificada como limpia tras el incidente de marzo de 2026.
  TRIVY_VERSION: v0.69.3

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Instalar dependencias (el lockfile no puede cambiar)
        run: yarn install --immutable

      - name: Comprobar tipos
        run: yarn tsc

      - name: Tests
        run: CI=true yarn test

      # helm viene preinstalado en los runners de GitHub
      - name: Lint y render del chart
        run: |
          helm lint chart -f chart/values-mgmt.yaml --set image.tag=ci
          helm template idp-backstage chart -f chart/values-mgmt.yaml --set image.tag=ci > /dev/null

  # En pull requests: construye sin publicar y escanea la imagen local
  scan-pr:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: idp-backstage:pr
          provenance: false
          sbom: false
          cache-from: type=gha

      - name: Instalar Trivy (acción fijada por SHA)
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Escanear con Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          skip-setup-trivy: true
          image-ref: idp-backstage:pr
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # En la rama principal, tres jobs con permisos distintos para aislar a Trivy de la identidad de firma:
  #   build (packages: write) -> scan (packages: read) -> sign (packages: write + id-token: write)

  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calcular nombre y tag de la imagen
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Trivy (acción fijada por SHA)
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Escanear la imagen publicada (por digest)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          skip-setup-trivy: true
          image-ref: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  sign:
    needs: [build, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Firmar la imagen (keyless)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Adjuntar el SBOM como attestation firmada
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

  # Despliega: escribe tag y digest en values-mgmt.yaml; Argo CD hace el resto
  deploy:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actualizar values-mgmt.yaml
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
          BRANCH: ${{ github.ref_name }}
        run: |
          yq -i '.image.repository = strenv(IMAGE) | .image.tag = strenv(TAG) | .image.digest = strenv(DIGEST)' chart/values-mgmt.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/values-mgmt.yaml
          git diff --cached --quiet && { echo "Sin cambios que desplegar"; exit 0; }
          git commit -m "chore(mgmt): desplegar ${TAG} [skip ci]"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
